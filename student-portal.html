<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | Apna Beauty & Silai Center</title>
<link rel="stylesheet" href="styles.css">
<style>
.portal{max-width:900px;margin:50px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 35px #5b173018;margin-bottom:20px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button,.btn2{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.tabs button.active,.btn2{background:#6f1238;color:#fff}.tabs button{background:#f5e9d7;color:#4e122e}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px;color:#4e122e}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddcbb8;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#fff6df;margin:12px 0}.error{background:#ffe9ed;color:#8a163b}.success{background:#eaf8ed;color:#17652b}.status{display:inline-block;padding:7px 12px;border-radius:999px;font-weight:900}.paid{background:#dff5e4;color:#17652b}.pending{background:#fff0c9;color:#815900}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.student-card{display:grid;gap:12px}.cert{display:inline-block;background:#6f1238;color:#fff;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:800}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #eadbc9;text-align:left}.small{font-size:12px;color:#765f67}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.admin-table{font-size:12px}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-round">A</span><span><b>Apna</b><small>BEAUTY & SILAI CENTER</small></span></a><a class="nav-admission" href="index.html">← Home</a></div></header>
<main class="portal">
<div class="section-heading"><span class="eyebrow">STUDENT PORTAL</span><h1>Student Login & Registration</h1><p>Apna Beauty & Silai Center</p></div>
<div id="setupNotice" class="notice">Portal backend connect nahi hua hai. Apps Script Web App URL configure karna hoga.</div>
<section id="authPanel" class="panel">
<div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Registration</button><button id="adminTab">Admin</button></div>
<form id="loginForm"><div class="field"><label>Mobile Number</label><input id="loginMobile" inputmode="numeric" maxlength="10" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn2">Login</button></form>
<form id="registerForm" class="hidden"><div class="grid"><div class="field"><label>Aadhaar Name</label><input id="regName" required><div class="small">Sirf Aadhaar par jo naam hai; Aadhaar number nahi.</div></div><div class="field"><label>Mobile Number</label><input id="regMobile" inputmode="numeric" maxlength="10" required></div></div><div class="grid"><div class="field"><label>Password</label><input id="regPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirm Password</label><input id="regPassword2" type="password" minlength="8" autocomplete="new-password" required></div></div><button class="btn2">Register</button></form>
<form id="adminForm" class="hidden"><div class="grid"><div class="field"><label>Admin Username</label><input id="adminUser" value="admin" autocomplete="username" required></div><div class="field"><label>Admin Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div></div><button class="btn2">Admin Login</button></form>
<div id="message"></div>
</section>
<section id="studentPanel" class="panel hidden"><div class="top"><div><span class="eyebrow">MY PROFILE</span><h2 id="studentName"></h2><p id="studentMobile"></p></div><button id="studentLogout" class="tabs button">Logout</button></div><div class="student-card"><div>Fee Status: <span id="feeStatus" class="status"></span></div><div id="certificateBox"></div></div></section>
<section id="adminPanel" class="panel hidden"><div class="top"><div><span class="eyebrow">ADMIN</span><h2>Student Management</h2></div><button id="adminLogout" class="tabs button">Logout</button></div><div id="adminList"></div></section>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwNoiOhQ04foFjeuh-qCfPimrPzJsKjXhsbEa58sL1fGnLGvN0-g5M2ZAT5kg5pCYWaIQ/exec';
const $=id=>document.getElementById(id); let token=localStorage.getItem('apnaPortalToken')||''; let role=localStorage.getItem('apnaPortalRole')||'';
function configured(){return API_URL.startsWith('https://script.google.com/')} function msg(text,type='notice'){$('message').innerHTML='<div class="'+type+' notice">'+escapeHtml(text)+'</div>'} function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(action,data={}){if(!configured())throw Error('Apps Script Web App URL configure nahi hai');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});return r.json()}
function showTab(which){['loginForm','registerForm','adminForm'].forEach(x=>$(x).classList.add('hidden'));$(which+'Form').classList.remove('hidden');['loginTab','registerTab','adminTab'].forEach(x=>$(x).classList.remove('active'));$(which+'Tab').classList.add('active');$('message').innerHTML=''}
$('loginTab').onclick=()=>showTab('login');$('registerTab').onclick=()=>showTab('register');$('adminTab').onclick=()=>showTab('admin');
$('registerForm').onsubmit=async e=>{e.preventDefault();if($('regPassword').value!==$('regPassword2').value)return msg('Password match nahi kar raha.','error');try{const x=await api('register',{aadhaarName:$('regName').value,mobile:$('regMobile').value,password:$('regPassword').value});if(!x.ok)return msg(x.error,'error');msg('Registration successful. Ab mobile aur password se login karo.','success');showTab('login');$('loginMobile').value=x.mobile}catch(e){msg(e.message,'error')}};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('login',{mobile:$('loginMobile').value,password:$('loginPassword').value});if(!x.ok)return msg(x.error,'error');saveSession(x.token,'student');renderStudent(x.profile);$('authPanel').classList.add('hidden');$('studentPanel').classList.remove('hidden')}catch(e){msg(e.message,'error')}};
$('adminForm').onsubmit=async e=>{e.preventDefault();try{const x=await api('adminLogin',{username:$('adminUser').value,password:$('adminPassword').value});if(!x.ok)return msg(x.error,'error');saveSession(x.token,'admin');$('authPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');loadAdmin()}catch(e){msg(e.message,'error')}};
function saveSession(t,r){token=t;role=r;localStorage.setItem('apnaPortalToken',t);localStorage.setItem('apnaPortalRole',r)} function clearSession(){token='';role='';localStorage.removeItem('apnaPortalToken');localStorage.removeItem('apnaPortalRole');location.reload()} $('studentLogout').onclick=clearSession;$('adminLogout').onclick=clearSession;
function renderStudent(p){$('studentName').textContent=p.name;$('studentMobile').textContent='Mobile: '+p.mobile;$('feeStatus').textContent=p.feeStatus;$('feeStatus').className='status '+(p.feeStatus==='PAID'?'paid':'pending');$('certificateBox').innerHTML=p.certificateFile?'<div><b>Certificate:</b><br><a class="cert" target="_blank" rel="noopener" href="'+escapeHtml(p.certificateFile)+'">📜 Certificate Download</a></div>':'<div class="notice">Certificate abhi upload nahi hua hai.</div>'}
async function loadAdmin(){try{const x=await api('adminStudents',{token});if(!x.ok)return alert(x.error);$('adminList').innerHTML=x.students.map(s=>'<div class="panel"><b>'+escapeHtml(s.name)+'</b><br>'+escapeHtml(s.mobile)+'<br>Fee: <select data-id="'+escapeHtml(s.studentId)+'" class="fee"><option '+(s.feeStatus==='PENDING'?'selected':'')+'>PENDING</option><option '+(s.feeStatus==='PAID'?'selected':'')+'>PAID</option></select> <button class="btn2 savefee" data-id="'+escapeHtml(s.studentId)+'">Save</button><div class="small">Certificate: '+(s.certificateFile?'Uploaded':'Not uploaded')+'</div><div class="field"><input type="file" class="certfile" data-id="'+escapeHtml(s.studentId)+'" accept=".pdf,image/*"><button class="btn2 upload" data-id="'+escapeHtml(s.studentId)+'">Upload Certificate</button></div></div>').join('')||'<p>No students registered.</p>';$('adminList').querySelectorAll('.savefee').forEach(b=>b.onclick=async()=>{const sel=$('adminList').querySelector('.fee[data-id="'+CSS.escape(b.dataset.id)+'"]');const x=await api('updateFee',{token,studentId:b.dataset.id,feeStatus:sel.value});if(!x.ok)alert(x.error);else loadAdmin()});$('adminList').querySelectorAll('.upload').forEach(b=>b.onclick=()=>uploadCert(b.dataset.id))}catch(e){alert(e.message)}}
async function uploadCert(id){const input=$('adminList').querySelector('.certfile[data-id="'+CSS.escape(id)+'"]');const file=input.files[0];if(!file)return alert('Certificate file select karo');if(file.size>8*1024*1024)return alert('Maximum 8 MB');const reader=new FileReader();reader.onload=async()=>{try{const base64=reader.result.split(',')[1];const x=await api('uploadCertificate',{token,studentId:id,fileName:file.name,mimeType:file.type||'application/pdf',base64});if(!x.ok)return alert(x.error);alert('Certificate Google Drive par upload ho gaya');loadAdmin()}catch(e){alert(e.message)}};reader.readAsDataURL(file)}
async function restore(){if(!token)return;try{if(role==='student'){const x=await api('profile',{token});if(x.ok){$('authPanel').classList.add('hidden');$('studentPanel').classList.remove('hidden');renderStudent(x.profile)}}else if(role==='admin'){const x=await api('adminStudents',{token});if(x.ok){$('authPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');loadAdmin()}}}catch(e){clearSession()}}
if(configured())$('setupNotice').classList.add('hidden');restore();
</script>
</body>
</html>
